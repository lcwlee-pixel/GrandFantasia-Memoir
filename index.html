<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Fantasia - 精靈樂章紀念館</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
            user-select: none;
        }

        /* 1. 開場影片層 */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .skip-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
            z-index: 1000;
        }
        .skip-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #fff;
        }

        /* 2. 登錄主畫面層 */
        #main-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('bg.png') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 1;
        }

        /* --- Logo 已放大 --- */
        .top-logo {
            position: relative;
            z-index: 2;
            width: 500px; /* 尺寸放大 */
            max-width: 85vw;
            margin-bottom: 25px;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.7));
        }

        /* --- 右上角系統設定按鈕 --- */
        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(30, 24, 18, 0.75);
            color: #e6c885;
            border: 2px solid #b89b5e;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5), inset 0 0 5px rgba(184, 155, 94, 0.2);
            backdrop-filter: blur(3px);
            transition: all 0.2s;
            z-index: 10;
            text-shadow: 1px 1px 2px #000;
        }
        
        .settings-btn:hover {
            background: rgba(184, 155, 94, 0.2);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(184, 155, 94, 0.5);
        }

        /* --- 設定面板 --- */
        .settings-panel {
            position: absolute;
            top: 70px;
            right: 20px;
            width: 220px;
            padding: 16px;
            background: rgba(30, 24, 18, 0.85);
            border: 2px solid #b89b5e;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            z-index: 10;
            display: none;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(5px);
        }

        .settings-title {
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #7c653d;
            padding-bottom: 8px;
            text-shadow: 1px 1px 2px #000;
        }

        .volume-control {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .volume-control span {
            color: #c9b078;
            font-size: 13px;
            text-shadow: 1px 1px 2px #000;
        }

        .volume-control input[type=range] {
            accent-color: #b89b5e;
            width: 100%;
            cursor: pointer;
        }

        /* --- 使用真實 UI 图片 (ui_bg.png) 的容器 --- */
        .login-ui-container {
            position: relative;
            z-index: 2;
            width: 420px; /* 根据图片比例适配 */
            height: 280px;
            background: url('ui_bg.png') no-repeat center center/contain;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 40px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.7));
        }

        /* 账号密码输入框精确嵌入 UI 中 */
        .input-wrapper {
            width: 260px;
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .input-title {
            color: #432e18; /* 契合原图字色或加深阴影 */
            font-size: 13px;
            font-weight: bold;
            text-shadow: 0px 1px 1px rgba(255,255,255,0.4);
        }

        .checkbox-label {
            color: #523b22;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            font-weight: bold;
        }

        .checkbox-label input {
            accent-color: #8c6d33;
            cursor: pointer;
        }

        .gf-input {
            width: 100%;
            height: 32px;
            background: transparent; /* 透明背景，完美贴合 UI 图片纹理 */
            border: none;
            outline: none;
            padding: 0 10px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        /* 确定按钮位置 */
        .gf-btn {
            width: 180px;
            height: 32px;
            background: linear-gradient(to bottom, #d4b572 0%, #8c6d33 100%);
            border: 1px solid #edd39a;
            border-radius: 3px;
            color: #2a1a08;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0px 1px 0px rgba(255, 255, 255, 0.4);
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
            margin-top: 5px;
        }

        .gf-btn:hover {
            background: linear-gradient(to bottom, #e3c683 0%, #9e7e42 100%);
        }

        .gf-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.4);
            background: linear-gradient(to bottom, #8c6d33 0%, #d4b572 100%);
        }
    </style>
</head>
<body>

    <!-- 1. 開場影片層 -->
    <div id="intro-screen">
        <video id="intro-video" autoplay muted playsinline preload="auto">
            <source src="logo.mp4" type="video/mp4">
            您的瀏覽器不支持 HTML5 影片播放。
        </video>
        <button class="skip-btn" onclick="finishIntro()">跳過動畫 ⏭</button>
    </div>

    <!-- 2. 登錄主畫面層 -->
    <div id="main-content">
        <div class="overlay"></div>

        <!-- 系統設定按鈕與面板 -->
        <button class="settings-btn" onclick="toggleSettings(event)">⚙️ 系統設定</button>
        
        <div id="settings-panel" class="settings-panel">
            <div class="settings-title">遊戲設定</div>
            <div class="volume-control">
                <span>背景音樂音量</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.3">
            </div>
        </div>

        <!-- 放大后的正中间 Logo -->
        <img src="gf.png" alt="Grand Fantasia Logo" class="top-logo">

        <!-- 登錄 UI 圖片容器 -->
        <div class="login-ui-container">
            <!-- 帳號行 -->
            <div class="input-wrapper" style="margin-bottom: 26px;">
                <div class="input-header">
                    <span class="input-title">帳號</span>
                    <label class="checkbox-label">
                        <input type="checkbox"> 記住帳號
                    </label>
                </div>
                <input type="text" class="gf-input" placeholder="" autocomplete="off">
            </div>

            <!-- 密碼行 -->
            <div class="input-wrapper" style="margin-bottom: 12px;">
                <div class="input-header">
                    <span class="input-title">密碼</span>
                    <label class="checkbox-label">
                        <input type="checkbox"> 虛擬鍵盤
                    </label>
                </div>
                <input type="password" class="gf-input" placeholder="" autocomplete="off">
            </div>

            <!-- 確定按鈕 -->
            <button class="gf-btn" onclick="handleLogin()">確定</button>
        </div>
    </div>

    <!-- 3. 背景音樂 (BGM) -->
    <audio id="bgm" loop preload="auto">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <script>
        const video = document.getElementById('intro-video');
        const introScreen = document.getElementById('intro-screen');
        const mainContent = document.getElementById('main-content');
        const bgm = document.getElementById('bgm');
        const settingsPanel = document.getElementById('settings-panel');
        const volumeSlider = document.getElementById('volume-slider');
        
        let introFinished = false;

        bgm.volume = 0.3;

        function toggleSettings(event) {
            event.stopPropagation();
            if (settingsPanel.style.display === 'flex') {
                settingsPanel.style.display = 'none';
            } else {
                settingsPanel.style.display = 'flex';
            }
        }

        volumeSlider.addEventListener('input', (e) => {
            bgm.volume = e.target.value;
        });

        document.addEventListener('click', (event) => {
            if (introFinished && bgm.paused) {
                bgm.play().catch(err => console.log("等待交互播放音樂: ", err));
            }
            
            if (settingsPanel.style.display === 'flex' && 
                !settingsPanel.contains(event.target) && 
                !event.target.classList.contains('settings-btn')) {
                settingsPanel.style.display = 'none';
            }
        });

        function finishIntro() {
            if (introFinished) return;
            introFinished = true;

            introScreen.style.opacity = '0';
            
            if (bgm.paused) {
                bgm.play().catch(err => console.log("自動播放被攔截: ", err));
            }

            setTimeout(() => {
                introScreen.style.display = 'none';
                mainContent.style.opacity = '1';
            }, 1000);
        }

        video.addEventListener('ended', finishIntro);

        function handleLogin() {
            alert("歡迎回到瑟斐爾大陸！");
        }

        document.addEventListener('DOMContentLoaded', () => {
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => console.log("Video autoplay caught."));
            }
        });
    </script>
</body>
</html>
