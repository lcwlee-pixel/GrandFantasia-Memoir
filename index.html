<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Fantasia - 精靈樂章紀念館</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. 開場影片層 -->
    <div id="intro-screen">
        <video id="intro-video" autoplay muted playsinline preload="auto">
            <source src="logo.mp4" type="video/mp4">
            您的瀏覽器不支持 HTML5 影片播放。
        </video>
        <button id="skip-btn" class="skip-btn" onclick="finishIntro(event)">跳過動畫 ⏭</button>
    </div>

    <!-- 2. 登錄与主界面容器 -->
    <div id="main-content">
        <div class="overlay"></div>

        <!-- 系統設定按鈕與面板 -->
        <button class="settings-btn" onclick="toggleSettings(event)">⚙️ 系統設定</button>
        
        <div id="settings-panel" class="settings-panel">
            <div class="settings-title">遊戲設定</div>
            
            <div class="setting-item">
                <span class="setting-label">版本主題</span>
                <select id="theme-select" onchange="changeTheme(this.value)">
                    <option value="1">初代經典</option>
                    <option value="2">二代主題</option>
                    <option value="3">三代主題</option>
                </select>
            </div>

            <div class="volume-control">
                <span>背景音樂音量</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.3">
            </div>
        </div>

        <!-- ================= [A. 登錄頁面區] ================= -->
        <div id="login-section">
            <img src="gf.png" alt="Grand Fantasia Logo" class="top-logo">

            <div class="login-ui-container">
                <img src="ui_bg.png" alt="UI Frame" class="ui-frame-img">

                <div class="input-box account-box">
                    <input type="text" class="gf-input" autocomplete="off">
                    <label class="checkbox-label">
                        <input type="checkbox"> 記住帳號
                    </label>
                </div>

                <div class="input-box password-box">
                    <input type="password" class="gf-input" autocomplete="off">
                    <label class="checkbox-label">
                        <input type="checkbox"> 虛擬鍵盤
                    </label>
                </div>

                <button class="gf-btn" onclick="handleLogin()">登錄</button>
            </div>
        </div>

        <!-- ================= [B. 主頁面區 (Main Page)] ================= -->
        <div id="main-page" class="main-page-container">
            <!-- 顶部游戏 HUD 状态栏 -->
            <div class="main-hud">
                <div class="player-info">
                    <div class="player-avatar">🧙‍♂️</div>
                    <div class="player-status">
                        <div class="player-name">精靈使者 <span class="player-lv">Lv.99</span></div>
                        <div class="bar-container hp-bar"><div class="bar-fill" style="width: 100%;"></div><span>HP 9999/9999</span></div>
                        <div class="bar-container mp-bar"><div class="bar-fill" style="width: 100%;"></div><span>MP 5000/5000</span></div>
                    </div>
                </div>
                <button class="logout-btn" onclick="handleLogout()">🚪 登出/返回</button>
            </div>

            <!-- 主页中心卡片区 -->
            <div class="main-body">
                <h1 class="welcome-title">歡迎回到瑟斐爾大陸</h1>
                <p class="welcome-subtitle">請選擇您要探索的紀念館區域</p>

                <div class="menu-cards">
                    <div class="menu-card" onclick="openWeaponPage()">
                        <div class="card-icon">⚔️</div>
                        <div class="card-title">精靈武器百科</div>
                        <div class="card-desc">查閱經典武器數據與製作配方</div>
                    </div>

                    <div class="menu-card" onclick="alert('【紀念館畫廊】開發中...')">
                        <div class="card-icon">📖</div>
                        <div class="card-title">紀念館畫廊</div>
                        <div class="card-desc">回顧三大主城與經典故事</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= [C. 武器百科獨立全屏頁面] ================= -->
        <div id="weapon-page" class="weapon-page-container">
            <div class="weapon-nav-bar">
                <button class="back-home-btn" onclick="closeWeaponPage()">⬅ 返回主頁面</button>
                <span class="page-title">精靈武器百科大典</span>
            </div>

            <div class="gf-craft-window">
                <div class="gf-craft-header">
                    <span class="gf-title-text">製作成功機率...</span>
                    <button class="gf-close-x" onclick="closeWeaponPage()">X</button>
                </div>

                <div class="gf-craft-body">
<!-- 1. 左欄：14大武器分類圖示按鈕列 + 分類樹 -->
                    <div class="craft-panel left-panel">
                        <!-- 14大武器分類圖示按鈕列（兩排各7個） -->
                        <div class="weapon-category-tabs">
                            <button class="cat-tab-btn active" onclick="switchCategory('sword', this)" title="劍類製造">
                                <img src="weapon/sword.png" alt="劍類">
                            </button>
                            <button class="cat-tab-btn" onclick="switchCategory('mac', this)" title="巨劍製造">
                                <img src="weapon/mac.png" alt="巨劍">
                            </button>
                            <button class="cat-tab-btn" onclick="switchCategory('axe', this)" title="斧類製造">
                                <img src="weapon/axe.png" alt="斧類">
                            </button>
                            <button class="cat-tab-btn" onclick="switchCategory('hammer', this)" title="槌類製造">
                                <img src="weapon/hammer.png" alt="槌類">
                            </button>
                            <button class="cat-tab-btn" onclick="switchCategory('bow', this)" title="弓箭製造">
                                <img src="weapon/bow.png" alt="弓箭">
                            </button>
                            <button class="cat-tab-btn" onclick="switchCategory('firearm', this)" title="火槍製造">
                                <img src="weapon/firearm.png" alt="火槍">
                            </button>
                            <button class="cat-tab-btn" onclick="switchCategory('staff', this)" title="法杖製造">
                                <img src="weapon/staff.png" alt="法杖">
                            </button>
                            <button class="cat-tab-btn" onclick="switchCategory('sheild', this)" title="盾牌製造">
                                <img src="weapon/sheild.png" alt="盾牌">
                            </button>
                            <button class="cat-tab-btn" onclick="switchCategory('scythe', this)" title="鐮刀製造">
                                <img src="weapon/scythe.png" alt="鐮刀">
                            </button>
                            <button class="cat-tab-btn" onclick="switchCategory('katana', this)" title="太刀製造">
                                <img src="weapon/katana.png" alt="太刀">
                            </button>
                            <button class="cat-tab-btn" onclick="switchCategory('handblade', this)" title="拳刃製造">
                                <img src="weapon/handblade.png" alt="拳刃">
                            </button>
                            <button class="cat-tab-btn" onclick="switchCategory('ninja', this)" title="忍具製造">
                                <img src="weapon/ninja.png" alt="忍具">
                            </button>
                            <button class="cat-tab-btn" onclick="switchCategory('maccanon', this)" title="魔導砲製造">
                                <img src="weapon/maccanon.png" alt="魔導砲">
                            </button>
                            <button class="cat-tab-btn" onclick="switchCategory('key', this)" title="魔鑰製造">
                                <img src="weapon/key.png" alt="魔鑰">
                            </button>
                        </div>

                        <!-- 當前選中的分類標題列 -->
                        <div class="panel-header-item">
                            <div class="icon-box">
                                <img id="current-cat-icon" src="weapon/sword.png" alt="分類圖示" style="width: 100%; height: 100%; object-fit: cover;">
                            </div>
                            <span id="current-cat-title" class="type-title">劍類製造</span>
                            <div class="chk-group">
                                <label><input type="checkbox" checked> 顯示可執行</label>
                                <label><input type="checkbox"> 過濾灰色項目</label>
                            </div>
                        </div>

                        <!-- 動態切換的武器樹狀清單 -->
                        <div id="weapon-tree-container" class="tree-container">
                            <!-- 切換分類時由 JS 自動渲染 -->
                        </div>
                    </div>
                    
                    <!-- 2. 中栏：属性与制作配方 -->
                    <div class="craft-panel middle-panel">
                        <div class="info-section">
                            <div class="yellow-label">製作物品</div>
                            <div id="weapon-stats-box" class="stats-box">
                                <div class="tip">請從左側選擇一件武器</div>
                            </div>
                        </div>

                        <div class="info-section">
                            <div class="yellow-label">所需材料</div>
                            <div id="weapon-mats-box" class="mats-box">--</div>
                        </div>

                        <div class="bottom-cost-area">
                            <span class="yellow-label inline">所需費用:</span>
                            <div class="coins">
                                <span id="c-gold">0</span><i class="coin-icon gold"></i>
                                <span id="c-silver">0</span><i class="coin-icon silver"></i>
                                <span id="c-copper">0</span><i class="coin-icon copper"></i>
                            </div>
                            <span class="yellow-label inline time-label">花費時間: <span id="c-time">0秒</span></span>
                        </div>
                    </div>

                    <!-- 3. 右栏：武器图片展示区 -->
                    <div class="craft-panel right-panel">
                        <div class="yellow-label">武器圖鑑展示</div>
                        <div class="image-display-frame">
                            <img id="weapon-preview-img" src="" alt="" style="display:none;">
                            <div id="image-placeholder" class="placeholder-text">
                                <span>🗡️</span>
                                <span>武器大圖展示區域</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="gf-craft-footer">
                    <button class="gf-win-btn" onclick="closeWeaponPage()">確定</button>
                    <button class="gf-win-btn" onclick="closeWeaponPage()">關閉</button>
                </div>
            </div>
        </div>

    </div>

    <!-- 3. 背景音樂 (BGM) -->
    <audio id="bgm" loop preload="auto">
        <source id="bgm-source" src="bgm.mp3" type="audio/mpeg">
    </audio>

    <!-- 4. 點擊音效 (SFX) -->
    <audio id="click-sfx" preload="auto">
        <source src="click.mp3" type="audio/mpeg">
    </audio>

    <!-- 引入独立的 JavaScript 脚本 -->
    <script src="script.js"></script>
</body>
</html>
