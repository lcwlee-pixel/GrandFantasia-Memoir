<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Fantasia - 精灵乐章纪念馆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        /* 开场视频容器 */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 保证视频比例完整显示，不拉伸 */
        }

        /* 跳过按钮 */
        .skip-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            padding: 10px 24px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
            z-index: 1000;
        }
        .skip-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }

        /* 主登录/回忆界面 */
        #main-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            opacity: 0;
            transition: opacity 1s ease;
        }

        .login-card {
            background: rgba(0, 0, 0, 0.5);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>

    <!-- 1. 开场动画层 -->
    <div id="intro-screen">
        <video id="intro-video" autoplay muted playsinline preload="auto">
            <source src="logo.mp4" type="video/mp4">
            您的浏览器不支持 HTML5 视频播放。
        </video>
        <button class="skip-btn" onclick="finishIntro()">跳过动画 ⏭</button>
    </div>

    <!-- 2. 主页面/登录门槛层 -->
    <div id="main-content">
        <div class="login-card">
            <h1>✨ 精灵乐章 Memoir</h1>
            <p style="margin: 15px 0; color: #ddd;">欢迎回到瑟斐尔大陆</p>
        </div>
    </div>

    <script>
        const video = document.getElementById('intro-video');
        const introScreen = document.getElementById('intro-screen');
        const mainContent = document.getElementById('main-content');

        // 淡出并切入主页面的核心函数
        function finishIntro() {
            introScreen.style.opacity = '0';
            setTimeout(() => {
                introScreen.style.display = 'none';
                mainContent.style.opacity = '1';
            }, 1000);
        }

        // 方案 A：如果你的视频文件本身就已经被裁剪成了 5 秒，播放完会自动触发此事件
        video.addEventListener('ended', finishIntro);

        // 方案 B：如果你的视频文件还是长视频，但你想用代码【强制在第 5 秒截断】并进入主页，
        // 可以取消下面三行代码的注释（删除斜杠星号），它会在播放到 5.0 秒时自动跳转：
        /*
        video.addEventListener('timeupdate', () => {
            if (video.currentTime >= 5.0) {
                finishIntro();
            }
        });
        */

        // 自动播放兼容处理
        document.addEventListener('DOMContentLoaded', () => {
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Autoplay was prevented, waiting for user click.");
                });
            }
        });
    </script>
</body>
</html>
